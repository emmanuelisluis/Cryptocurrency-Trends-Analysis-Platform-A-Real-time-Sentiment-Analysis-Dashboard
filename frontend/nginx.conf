server {
    listen 80;
    server_name localhost; # Adjust if deploying to a specific domain

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Standard handling for client-side routing (e.g., React Router)
    # If a requested file or directory is not found, serve index.html.
    # This allows React Router to handle the routing on the client side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Add cache control headers for static assets for better performance
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y; # Cache these assets for a long time
        add_header Cache-Control "public";
    }

    # Optional: Proxy API requests to the backend
    # This is useful if you want to serve both frontend and backend under the same domain
    # to avoid CORS issues, or to simplify configuration for the client.
    # Assumes backend is running on a service named 'backend' on port 8000 (typical in Docker Compose).
    # location /api/v1 {
    #     proxy_pass http://backend_service_name:8000; # Replace 'backend_service_name' with actual name in Docker network
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;

    #     # Optional: WebSocket proxying if your API uses WebSockets directly on this path
    #     # proxy_http_version 1.1;
    #     # proxy_set_header Upgrade $http_upgrade;
    #     # proxy_set_header Connection "upgrade";
    # }

    # Optional: Add security headers
    # add_header X-Frame-Options "SAMEORIGIN";
    # add_header X-Content-Type-Options "nosniff";
    # add_header X-XSS-Protection "1; mode=block";
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
